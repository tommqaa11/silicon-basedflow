<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>硅基流动余额查询</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: #0f1218;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .background {
            position: absolute;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(45deg, #1a1f2c 25%, transparent 25%),
                        linear-gradient(-45deg, #1a1f2c 25%, transparent 25%),
                        linear-gradient(45deg, transparent 75%, #1a1f2c 75%),
                        linear-gradient(-45deg, transparent 75%, #1a1f2c 75%);
            background-size: 20px 20px;
            animation: backgroundMove 20s linear infinite;
            opacity: 0.1;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 500px;
            z-index: 1;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: #4fd1c5;
            font-size: 1.8rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        input {
            width: 100%;
            padding: 0.8rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #4fd1c5;
            box-shadow: 0 0 10px rgba(79, 209, 197, 0.3);
        }

        button {
            width: 100%;
            padding: 0.8rem;
            background: #4fd1c5;
            border: none;
            border-radius: 8px;
            color: #0f1218;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #38b2ac;
            transform: translateY(-2px);
        }

        .result {
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .balance {
            font-size: 2rem;
            color: #4fd1c5;
            margin: 0.5rem 0;
        }

        @keyframes backgroundMove {
            from {
                background-position: 0 0;
            }
            to {
                background-position: 40px 40px;
            }
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 1rem;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #4fd1c5;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="container">
        <h1>硅基流动余额查询</h1>
        <div class="input-group">
            <input type="password" id="apiKey" placeholder="请输入您的 API Key" />
        </div>
        <button onclick="checkBalance()">查询余额</button>
        <div class="loading" id="loading"></div>
        <div class="result" id="result">
            <div>当前总余额</div>
            <div class="balance" id="balance">¥ 0.00</div>
        </div>
    </div>

    <script>
        function checkBalance() {
            const apiKey = document.getElementById('apiKey').value;
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const balance = document.getElementById('balance');

            if (!apiKey) {
                alert('请输入API Key');
                return;
            }

            loading.style.display = 'block';
            result.style.display = 'none';

            const options = {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${apiKey}`
                }
            };

            fetch('https://api.siliconflow.cn/v1/user/info', options)
                .then(response => response.json())
                .then(response => {
                    loading.style.display = 'none';
                    result.style.display = 'block';
                    
                    if (response.code === 20000 && response.status) {
                        balance.textContent = `¥ ${response.data.totalBalance}`;
                    } else {
                        balance.textContent = '查询失败';
                    }
                })
                .catch(err => {
                    loading.style.display = 'none';
                    result.style.display = 'block';
                    balance.textContent = '请求错误';
                    console.error(err);
                });
        }
    </script>
</body>
</html>
